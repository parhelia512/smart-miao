# =====================================================================
# bee-budget-backend 生产部署编排文件
# 此文件不含 build 段，仅用于从 ACR 拉取镜像并启动
# =====================================================================
# 部署流程：
# 1. 放到推荐目录（不是"随便"放）
# sudo mkdir -p /opt/bee-budget-backend
# 把 docker-compose.prod.yml 上传到该目录
#
# 2. cd 进去（必须！compose 以当前目录为上下文）
# cd /opt/bee-budget-backend
#
# 3. 首次部署：创建外部卷 + 登录镜像仓库 + 启动
# docker volume create bee-budget-uploads
# docker volume create bee-budget-logs
# docker login --username=18353674768 crpi-69yp864c0wdn7m3t.cn-qingdao.personal.cr.aliyuncs.com
# docker compose -f docker-compose.prod.yml up -d --pull always
#
# 4. 后续更新：只需改版本号，重新上传 docker-compose.prod.yml，然后
# docker compose -f docker-compose.prod.yml up -d --pull always
# 
# 5. 停止并删除容器（数据卷保留）
# docker compose -f docker-compose.prod.yml down

services:
  # ==================== 后端 API ====================
  bedrock.webapi:
    # 改动：替换为 ACR 远程镜像地址（删掉 build 段）
    image: crpi-69yp864c0wdn7m3t.cn-qingdao.personal.cr.aliyuncs.com/purrylab/bee-budget-backend:1.0.0
    container_name: bee-budget-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # 应用通过 AppSettings:HttpPort 配置 Kestrel 监听端口
      # 必须与 Dockerfile 的 EXPOSE 8080 / HEALTHCHECK 保持一致
      AppSettings__HttpPort: 8080
    ports:
      - "10003:8080"
    volumes:
      # 日志持久化：使用已创建的命名卷 bee-budget-logs
      - bee-budget-logs:/app/logs
      # 上传文件持久化：使用已创建的命名卷 bee-budget-uploads
      - bee-budget-uploads:/app/wwwroot/uploads
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

# ==================== 数据卷 ====================
# 外部命名卷（已手动创建：docker volume create bee-budget-uploads）
volumes:
  bee-budget-logs:
    external: true
    name: bee-budget-logs
  bee-budget-uploads:
    external: true
    name: bee-budget-uploads