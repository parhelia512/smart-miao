server {
    listen       8000;
    server_name  localhost;

    # Gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # 后端 API 代理 ← 放在前面，路径带 /frontend 前缀
    location /frontend/prod-api/ {
        proxy_pass ${BACKEND_URL}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
        # 允许大文件上传
        client_max_body_size 100m;
    }
    
    # 后端上传文件代理
    location /frontend/uploads/ {
        proxy_pass ${BACKEND_URL}/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # 前端静态资源（location 和 alias 末尾必须都带 / 以避免 alias+try_files 路径拼接 bug）
    location /frontend/ {
        alias   /usr/share/nginx/html/frontend/;
        index   index.html index.htm;
        try_files $uri $uri/ /frontend/index.html;
    }

    # 根路径重定向到前端
    location = / {
        return 301 /frontend/;
    }

    # 错误页面
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
